name: Deploy to Server

on:
  push:
    branches:
      - main
  # يسمح لك بتشغيل السكربت يدوياً من GitHub
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Deploy via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          # المحاولة عبر Explicit FTPS (منفذ 21) وهو النظام الشائع والمطلوب في أغلب لوحات cPanel
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set net:timeout 15;
            set net:max-retries 2;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_SERVER;
            mirror -R -x .git/ -x .github/ -x database.sql -x README.md ./ ./
          "

      # ---------------------------------------------------------
      # خيار 2: الرفع باستخدام SSH/Rsync (للسيرفرات الخاصة VPS)
