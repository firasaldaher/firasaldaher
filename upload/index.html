<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع ملفات الفيديو | ENG. Firas Daher</title>
    <meta name="description" content="صفحة رفع ملفات الفيديو للمونتاج — تدعم حتى 200 MB">
    <meta name="author" content="ENG. Firas Daher">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#fff;--surface:#f8f9fa;--text:#202124;--muted:#5f6368;--primary:#1a73e8;--primary-h:#174ea6;--green:#34a853;--red:#ea4335;--yellow:#fbbc04;--border:rgba(218,220,224,.65);--shadow:0 4px 28px rgba(0,0,0,.07);--font:'Tajawal','Inter',sans-serif;--r:16px;--rsm:10px}
        body.dark{--bg:#202124;--surface:#303134;--text:#e8eaed;--muted:#9aa0a6;--border:rgba(95,99,104,.55);--primary:#8ab4f8;--primary-h:#aecbfa;--shadow:0 4px 28px rgba(0,0,0,.28)}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;transition:background .3s,color .3s}
        body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(110px);z-index:-1;pointer-events:none;opacity:.11}
        body::before{width:580px;height:580px;background:var(--primary);top:-180px;left:-80px}
        body::after{width:480px;height:480px;background:var(--green);bottom:-80px;right:-80px}
        /* NAV */
        .nav{position:fixed;inset:0 0 auto 0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:background .3s}
        body.dark .nav{background:rgba(32,33,36,.88)}
        .nav-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;color:var(--primary);text-decoration:none}
        .nav-logo svg{width:24px;height:24px;flex-shrink:0}
        .nav-right{display:flex;align-items:center;gap:10px}
        .nav-link{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.88rem;text-decoration:none;padding:6px 14px;border-radius:20px;border:1px solid var(--border);transition:all .2s}
        .nav-link:hover{background:var(--surface);color:var(--primary)}
        .icon-btn{width:38px;height:38px;border-radius:50%;cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .2s}
        .icon-btn:hover{background:var(--surface);color:var(--primary)}
        /* PAGE */
        .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px 60px}
        .header{text-align:center;max-width:540px;margin-bottom:32px}
        .badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--primary);background:rgba(26,115,232,.1);padding:4px 14px;border-radius:20px;margin-bottom:12px}
        .header h1{font-size:clamp(1.55rem,4vw,2.3rem);font-weight:700;line-height:1.3;margin-bottom:8px}
        .header p{color:var(--muted);font-size:.97rem}
        /* CARD */
        .card{width:100%;max-width:620px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--r);padding:34px;box-shadow:var(--shadow)}
        body.dark .card{background:rgba(48,49,52,.82)}
        /* DROP ZONE */
        .dz{border:2px dashed var(--border);border-radius:var(--rsm);padding:44px 20px;text-align:center;cursor:pointer;transition:all .22s;user-select:none}
        .dz:hover,.dz.over{border-color:var(--primary);background:rgba(26,115,232,.04)}
        .dz.over{transform:scale(1.015)}
        .dz.ready{border-color:var(--green);background:rgba(52,168,83,.04)}
        .dz-ico{width:68px;height:68px;border-radius:50%;margin:0 auto 16px;background:rgba(26,115,232,.1);display:flex;align-items:center;justify-content:center;transition:all .25s}
        .dz:hover .dz-ico,.dz.over .dz-ico{background:rgba(26,115,232,.18);transform:scale(1.1)}
        .dz.ready .dz-ico{background:rgba(52,168,83,.15)}
        .dz-ico svg{width:32px;height:32px}
        .dz-title{font-size:1.05rem;font-weight:600;margin-bottom:5px}
        .dz-sub{font-size:.85rem;color:var(--muted);margin-bottom:14px}
        .pick-btn{display:inline-flex;align-items:center;gap:7px;background:var(--primary);color:#fff;padding:9px 22px;border-radius:22px;font-family:var(--font);font-size:.88rem;font-weight:600;border:none;cursor:pointer;transition:background .2s,transform .15s}
        .pick-btn:hover{background:var(--primary-h);transform:translateY(-1px)}
        .fmts{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:16px}
        .fmt{background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:.72rem;font-weight:700;color:var(--muted);padding:3px 9px}
        /* PREVIEW */
        .prev-row{display:none;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:13px 15px;margin-top:18px}
        .prev-row.show{display:flex;animation:fu .25s ease}
        @keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        .prev-thumb{width:44px;height:44px;flex-shrink:0;border-radius:9px;background:rgba(26,115,232,.12);display:flex;align-items:center;justify-content:center}
        .prev-thumb svg{width:22px;height:22px;color:var(--primary)}
        .prev-meta{flex:1;min-width:0}
        .prev-name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .prev-size{font-size:.78rem;color:var(--muted)}
        .clear-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:50%;display:flex;transition:all .2s}
        .clear-btn:hover{background:rgba(234,67,53,.1);color:var(--red)}
        /* FORM */
        .form-grid{margin-top:22px;display:flex;flex-direction:column;gap:14px}
        .form-group{display:flex;flex-direction:column;gap:5px}
        .lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
        .inp,.sel,.txta{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg);color:var(--text);font-family:var(--font);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s}
        body.dark .inp,body.dark .sel,body.dark .txta{background:var(--surface)}
        .inp:focus,.sel:focus,.txta:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.12)}
        .txta{resize:vertical;min-height:84px}
        .sel{cursor:pointer}
        /* PROGRESS */
        .prog-box{display:none;flex-direction:column;gap:7px;margin-top:18px}
        .prog-box.show{display:flex}
        .prog-hdr{display:flex;justify-content:space-between;align-items:center}
        .prog-lbl{font-size:.83rem;font-weight:600}
        .prog-pct{font-size:.83rem;font-weight:700;color:var(--primary)}
        .prog-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
        .prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--green));border-radius:99px;transition:width .35s ease}
        .prog-meta{font-size:.76rem;color:var(--muted)}
        /* ALERTS */
        .alert{display:none;align-items:center;gap:10px;padding:13px 15px;border-radius:var(--rsm);font-size:.88rem;font-weight:500;margin-top:16px}
        .alert.show{display:flex;animation:fu .25s ease}
        .alert svg{width:18px;height:18px;flex-shrink:0}
        .alert-ok{background:rgba(52,168,83,.1);border:1px solid rgba(52,168,83,.3);color:var(--green)}
        .alert-err{background:rgba(234,67,53,.08);border:1px solid rgba(234,67,53,.28);color:var(--red)}
        /* BUTTONS */
        .up-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;margin-top:22px;background:var(--primary);color:#fff;border:none;border-radius:var(--rsm);font-family:var(--font);font-size:.97rem;font-weight:700;cursor:pointer;transition:background .2s,transform .15s,opacity .2s}
        .up-btn:hover:not(:disabled){background:var(--primary-h);transform:translateY(-2px)}
        .up-btn:disabled{opacity:.5;cursor:not-allowed}
        .spin{width:19px;height:19px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .65s linear infinite;display:none}
        .spin.on{display:block}
        @keyframes sp{to{transform:rotate(360deg)}}
        .ctrl-row{display:none;gap:10px;margin-top:10px}
        .ctrl-row.show{display:flex}
        .ctrl{flex:1;padding:9px 14px;font-family:var(--font);font-size:.88rem;font-weight:600;border-radius:var(--rsm);cursor:pointer;transition:all .2s}
        .ctrl-pause{background:var(--surface);color:var(--text);border:1px solid var(--border)}
        .ctrl-pause:hover{background:rgba(251,188,4,.12);border-color:var(--yellow)}
        .ctrl-cancel{background:rgba(234,67,53,.08);color:var(--red);border:1px solid rgba(234,67,53,.25)}
        .ctrl-cancel:hover{background:rgba(234,67,53,.18)}
        /* CHIPS */
        .chips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
        .chip{display:flex;align-items:center;gap:5px;font-size:.77rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 11px}
        .chip svg{width:13px;height:13px}
        .chip strong{color:var(--text)}
        @media(max-width:580px){.nav{padding:12px 16px}.card{padding:22px 16px}.page{padding:88px 14px 48px}.dz{padding:34px 14px}}
    </style>
</head>
<body>
<nav class="nav">
    <a href="/" class="nav-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M17 7h5M2 17h5M17 17h5"/></svg>
        Firas Daher
    </a>
    <div class="nav-right">
        <a href="/" class="nav-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            الرئيسية
        </a>
        <button id="theme-btn" class="icon-btn" title="تبديل الوضع">
            <svg id="ico-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="ico-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
</nav>

<main class="page">
    <div class="header">
        <span class="badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M18 15v3H6v-3H4v3a2 2 0 002 2h12a2 2 0 002-2v-3zM7 9l1.41 1.41L11 7.83V16h2V7.83l2.59 2.58L17 9l-5-5z"/></svg> رفع ملفات</span>
        <h1>رفع ملفات الفيديو</h1>
        <p>ارفع ملفات المونتاج بسهولة وأمان — يدعم حتى <strong>200 MB</strong></p>
    </div>

    <div class="card">
        <div class="dz" id="drop-zone">
            <div class="dz-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <p class="dz-title">اسحب الملف هنا أو اضغط للاختيار</p>
            <p class="dz-sub">الحد الأقصى <strong>200 MB</strong> — ملفات فيديو فقط</p>
            <button class="pick-btn" id="pick-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                اختر ملفاً
            </button>
            <input type="file" id="file-input" accept="video/*,.mp4,.mov,.avi,.mkv,.wmv,.flv,.webm,.m4v,.mxf" style="display:none">
            <div class="fmts">
                <span class="fmt">MP4</span><span class="fmt">MOV</span><span class="fmt">AVI</span>
                <span class="fmt">MKV</span><span class="fmt">WMV</span><span class="fmt">FLV</span>
                <span class="fmt">WEBM</span><span class="fmt">M4V</span><span class="fmt">MXF</span>
            </div>
        </div>

        <div class="prev-row" id="prev-row">
            <div class="prev-thumb">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="3"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
            </div>
            <div class="prev-meta">
                <div class="prev-name" id="prev-name">—</div>
                <div class="prev-size" id="prev-size">—</div>
            </div>
            <button class="clear-btn" id="clear-btn" title="إزالة الملف">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="lbl" for="f-title">اسم المشروع / الفيديو *</label>
                <input type="text" id="f-title" class="inp" placeholder="مثال: فيديو ترويجي — شركة كرواي">
            </div>
            <div class="form-group">
                <label class="lbl" for="f-type">نوع المحتوى</label>
                <select id="f-type" class="sel">
                    <option value="">اختر النوع...</option>
                    <option value="promo">فيديو ترويجي</option>
                    <option value="tutorial">تعليمي / توضيحي</option>
                    <option value="social">محتوى سوشيال ميديا</option>
                    <option value="documentary">وثائقي</option>
                    <option value="raw">مادة خام (Raw Footage)</option>
                    <option value="other">أخرى</option>
                </select>
            </div>
            <div class="form-group">
                <label class="lbl" for="f-notes">ملاحظات للمحرر</label>
                <textarea id="f-notes" class="txta" placeholder="أي تعليمات للمونتاج: موسيقى خلفية، قص، تأثيرات..."></textarea>
            </div>
        </div>

        <div class="prog-box" id="prog-box">
            <div class="prog-hdr">
                <span class="prog-lbl" id="prog-lbl">جارٍ الرفع...</span>
                <span class="prog-pct" id="prog-pct">0%</span>
            </div>
            <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
            <span class="prog-meta" id="prog-meta"></span>
        </div>

        <div class="alert alert-ok" id="alert-ok">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span id="msg-ok">تم الرفع بنجاح!</span>
        </div>
        <div class="alert alert-err" id="alert-err">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <span id="msg-err">حدث خطأ.</span>

        <button class="up-btn" id="upload-btn" disabled>
            <span class="spin" id="spin-el"></span>
            <svg id="btn-ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

        <div class="chips">

            <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>حتى <strong>200 MB</strong></span></div>
            <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>رفع متوازٍ <strong>4 مسارات</strong></span></div>
        </div>
    </div>
</main>

<script>
'use strict';
const MAX_BYTES=200*1024*1024,CHUNK_SIZE=5*1024*1024,CONCURRENCY=4,MAX_RETRY=3,RETRY_BASE=600;
const EP_INIT='/api/upload/index.php?action=init';
const EP_CHUNK='/api/upload/index.php?action=chunk';
const EP_FINISH='/api/upload/index.php?action=finish';

const $=id=>document.getElementById(id);
const dropZone=$('drop-zone'),fileInput=$('file-input'),pickBtn=$('pick-btn');
const prevRow=$('prev-row'),prevName=$('prev-name'),prevSz=$('prev-size'),clearBtn=$('clear-btn');
const uploadBtn=$('upload-btn'),spinEl=$('spin-el'),btnIco=$('btn-ico');
const progBox=$('prog-box'),progLbl=$('prog-lbl'),progPct=$('prog-pct'),progFill=$('prog-fill'),progMeta=$('prog-meta');
const alertOk=$('alert-ok'),alertErr=$('alert-err'),msgOk=$('msg-ok'),msgErr=$('msg-err');
const ctrlRow=$('ctrl-row'),pauseBtn=$('pause-btn'),cancelBtn=$('cancel-btn');
const themeBtn=$('theme-btn'),icoSun=$('ico-sun'),icoMoon=$('ico-moon');

let file=null,uploadId=null,state='idle',totalChunks=0,doneChunks=0,bytesDone=0,startedAt=0,pauseFlag=false,queue=[],controllers=[];
const speedBuf=[];

function applyTheme(dark){document.body.classList.toggle('dark',dark);icoSun.style.display=dark?'none':'';icoMoon.style.display=dark?'':'none'}
applyTheme(localStorage.getItem('theme')==='dark');
themeBtn.addEventListener('click',()=>{const d=!document.body.classList.contains('dark');applyTheme(d);localStorage.setItem('theme',d?'dark':'light')});

dropZone.addEventListener('dragenter',e=>{e.preventDefault();dropZone.classList.add('over')});
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('over')});
dropZone.addEventListener('dragleave',e=>{if(!dropZone.contains(e.relatedTarget))dropZone.classList.remove('over')});
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
dropZone.addEventListener('click',e=>{if(pickBtn.contains(e.target))return;fileInput.click()});
pickBtn.addEventListener('click',e=>{e.stopPropagation();fileInput.click()});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])handleFile(fileInput.files[0])});

function handleFile(f){
    clearAlerts();
    if(f.size>MAX_BYTES){showErr('حجم الملف ('+fmt(f.size)+') يتجاوز 200 MB.');return}
    if(!f.type.startsWith('video/')&&!/\.(mp4|mov|avi|mkv|wmv|flv|webm|m4v|mxf)$/i.test(f.name)){showErr('الرجاء اختيار ملف فيديو.');return}
    file=f;prevName.textContent=f.name;prevSz.textContent=fmt(f.size);
    prevRow.classList.add('show');dropZone.classList.add('ready');uploadBtn.disabled=false;resetProg()
}

clearBtn.addEventListener('click',resetAll);
function resetAll(){abortAll();file=null;fileInput.value='';prevRow.classList.remove('show');dropZone.classList.remove('ready','over');uploadBtn.disabled=true;resetProg();clearAlerts();ctrlRow.classList.remove('show');state='idle'}

uploadBtn.addEventListener('click',async()=>{
    if(!file)return;
    const title=$('f-title').value.trim();
    if(!title){showErr('يرجى إدخال اسم المشروع أولاً.');$('f-title').focus();return}
    clearAlerts();await startUpload(title)
});

async function startUpload(title){
    totalChunks=Math.ceil(file.size/CHUNK_SIZE);doneChunks=0;bytesDone=0;startedAt=Date.now();pauseFlag=false;speedBuf.length=0;
    queue=Array.from({length:totalChunks},(_,i)=>i);state='running';
    setBusy(true);ctrlRow.classList.add('show');progBox.classList.add('show');progLbl.textContent='جارٍ الاتصال...';
    try{
        const res=await jsonPost(EP_INIT,{filename:file.name,filesize:file.size,chunks:totalChunks,title,type:$('f-type').value,notes:$('f-notes').value});
        uploadId=res.uploadId
    }catch(e){showErr('فشل بدء الجلسة: '+e.message);setBusy(false);ctrlRow.classList.remove('show');state='error';return}
    progLbl.textContent='جارٍ الرفع — '+totalChunks+' جزء...';
    await runWorkers();
    if(state==='running'&&doneChunks===totalChunks)await finish()
}

async function runWorkers(){await Promise.all(Array.from({length:CONCURRENCY},()=>worker()))}

async function worker(){
    while(true){
        if(pauseFlag||state!=='running')break;
        const idx=queue.shift();if(idx===undefined)break;
        const ok=await uploadChunk(idx);
        if(!ok&&state==='running'){abortAll();showErr('فشل رفع جزء بعد '+MAX_RETRY+' محاولات.');setBusy(false);ctrlRow.classList.remove('show');state='error';return}
    }
}

async function uploadChunk(idx){
    const start=idx*CHUNK_SIZE,end=Math.min(start+CHUNK_SIZE,file.size),blob=file.slice(start,end),sz=end-start;
    for(let a=0;a<MAX_RETRY;a++){
        if(pauseFlag||state!=='running')return false;
        const ac=new AbortController();controllers.push(ac);
        try{
            const form=new FormData();
            form.append('uploadId',uploadId);form.append('chunkIndex',idx);form.append('totalChunks',totalChunks);form.append('chunk',blob,'chunk');
            const t0=Date.now(),res=await fetch(EP_CHUNK,{method:'POST',body:form,signal:ac.signal}),dt=(Date.now()-t0)/1000;
            controllers=controllers.filter(c=>c!==ac);
            if(!res.ok)throw new Error('HTTP '+res.status);
            doneChunks++;bytesDone+=sz;speedBuf.push(sz/dt);if(speedBuf.length>8)speedBuf.shift();renderProg();return true
        }catch(e){
            controllers=controllers.filter(c=>c!==ac);
            if(e.name==='AbortError')return false;
            if(a<MAX_RETRY-1){progLbl.textContent='إعادة محاولة الجزء '+(idx+1)+'...';await sleep(RETRY_BASE*(2**a))}
        }
    }
    return false
}

async function finish(){
    try{
        progLbl.textContent='جارٍ دمج الأجزاء...';
        await jsonPost(EP_FINISH,{uploadId,filename:file.name});
        setPct(100);progLbl.textContent='اكتمل الرفع!';progMeta.textContent='تم في '+fmtT((Date.now()-startedAt)/1000);
        state='done';setBusy(false);ctrlRow.classList.remove('show');showOk('تم رفع "'+file.name+'" بنجاح ✅')
    }catch(e){showErr('فشل الدمج: '+e.message);setBusy(false);ctrlRow.classList.remove('show');state='error'}
}

pauseBtn.addEventListener('click',()=>{
    if(state==='running'){pauseFlag=true;state='paused';abortAll();pauseBtn.textContent='▶ متابعة';progLbl.textContent='متوقف مؤقتاً...'}
    else if(state==='paused'){pauseFlag=false;state='running';pauseBtn.textContent='⏸ إيقاف مؤقت';runWorkers().then(()=>{if(state==='running'&&doneChunks===totalChunks)finish()})}
});
cancelBtn.addEventListener('click',()=>{abortAll();state='idle';pauseBtn.textContent='⏸ إيقاف مؤقت';setBusy(false);ctrlRow.classList.remove('show');resetProg();showErr('تم إلغاء الرفع.')});
function abortAll(){controllers.forEach(c=>{try{c.abort()}catch(_){}});controllers=[];pauseFlag=false}

function renderProg(){const p=Math.round(doneChunks/totalChunks*100);setPct(p);const spd=speedBuf.length?speedBuf.reduce((a,b)=>a+b,0)/speedBuf.length:0,left=spd>0?(file.size-bytesDone)/spd:0;progLbl.textContent='رفع '+doneChunks+' من '+totalChunks+' جزء';progMeta.textContent=spd>0?fmt(spd)+'/ث — متبقي: '+fmtT(left)+' — '+fmt(bytesDone)+' / '+fmt(file.size):''}
function setPct(p){progFill.style.width=p+'%';progPct.textContent=p+'%'}
function resetProg(){progBox.classList.remove('show');setPct(0);progLbl.textContent='جارٍ الرفع...';progMeta.textContent=''}
function setBusy(on){uploadBtn.disabled=on;spinEl.classList.toggle('on',on);btnIco.style.display=on?'none':''}
function showOk(m){msgOk.textContent=m;alertOk.classList.add('show');alertErr.classList.remove('show')}
function showErr(m){msgErr.textContent=m;alertErr.classList.add('show');alertOk.classList.remove('show')}
function clearAlerts(){alertOk.classList.remove('show');alertErr.classList.remove('show')}
async function jsonPost(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j.ok===false)throw new Error(j.error||'Server error');return j}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function fmt(b){if(b>=1048576)return(b/1048576).toFixed(1)+' MB';if(b>=1024)return Math.round(b/1024)+' KB';return b+' B'}
function fmtT(s){if(s<60)return Math.round(s)+' ث';if(s<3600)return Math.round(s/60)+' د';return Math.round(s/3600)+' س'}
</script>
