        .article-content { max-width: 800px; margin: 0 auto; background: rgba(17, 24, 39, 0.7); padding: 3rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .article-content h2 { margin-top: 2rem; color: var(--primary); }

    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <header class="navbar" style="background: rgba(11, 15, 25, 0.95); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);">
        <div class="container nav-container">
            <a href="/" class="logo">Dev<span>Craft</span></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">الرئيسية</a></li>
                    <li><a href="/insights/index.html">المقالات</a></li>
                    <li><a href="/contact/index.html" class="btn btn-primary">تواصل معي</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main style="padding-top: 120px; padding-bottom: 50px;">
        <section class="container">
            <div class="article-content glass-card">
                <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">تواصل معي</h1>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">ابدأ مشروعك الآن</p>
                <p>جاهز لمناقشة فكرة مشروعك؟ استخدم النموذج أدناه (أو أرسل لي بريداً إلكترونياً) وسأعود إليك في أقرب وقت.</p><form class="contact-form" action="#" style="display:flex;flex-direction:column;gap:1rem;"><input type="text" placeholder="الاسم الكريم" required style="padding:1rem;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;"><input type="email" placeholder="البريد الإلكتروني" required style="padding:1rem;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;"><textarea placeholder="حدثني عن فكرة مشروعك..." rows="5" required style="padding:1rem;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;"></textarea><button type="submit" class="btn btn-primary" style="padding:1rem;font-size:1.1rem;">إرسال الطلب</button></form>
                <a href="/contact/index.html" class="btn btn-primary" style="margin-top: 2rem;">هل تريد نتيجة مشابهة؟ تواصل معي</a>

        </section>

        </div>
